<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>I Love You Naomi</title>
  <!-- Canvas Confetti Library -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0d1b2a; /* Deep navy blue background */
      color: #1b263b; /* Dark navy text */
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
      text-align: center;
    }
    .card {
      background: #ffffff;
      padding: 35px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
      max-width: 420px;
      width: 100%;
    }
    .header-image {
      max-width: 120px;
      height: auto;
      margin-bottom: 15px;
      display: block;
      margin-left: auto;
      margin-right: auto;
    }
    h1 {
      font-size: 1.2rem;
      color: #1d3557;
      margin-top: 10px;
      margin-bottom: 20px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    
    .meds-btn {
      font-size: 0.9rem;
      background-color: #1d3557; /* Deep Navy theme */
      color: white;
      border: none;
      width: auto; /* Fits text tightly */
      display: inline-block;
      padding: 10px 18px;
      border-radius: 25px;
      cursor: pointer;
      font-weight: bold;
      margin-bottom: 10px;
      transition: background-color 0.2s, transform 0.1s;
    }

    .meds-btn:active {
      transform: scale(0.98);
      background-color: #457b9d;
    }

    .status-msg {
      font-size: 0.95rem;
      color: #1d3557;
      font-weight: bold;
      display: none;
      margin-bottom: 15px;
      animation: fadeIn 0.5s ease-in-out;
    }

    /* Weekly Tracker Styles */
    .weekly-tracker-container {
      margin-bottom: 25px;
    }

    .tracker-title {
      font-size: 0.85rem;
      font-weight: bold;
      color: #1d3557;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .weekly-tracker {
      display: flex;
      justify-content: space-between;
      background-color: #f8f9fa;
      padding: 12px 16px;
      border-radius: 12px;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.03);
    }

    .day-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      user-select: none;
    }

    .day-label {
      font-size: 0.8rem;
      font-weight: bold;
      color: #1d3557;
    }

    .day-checkbox {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 2px solid #1d3557;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.2s, border-color 0.2s, transform 0.1s;
      background-color: #ffffff;
    }

    .day-box:active .day-checkbox {
      transform: scale(0.9);
    }

    .day-checkbox.checked {
      background-color: #2a9d8f;
      border-color: #2a9d8f;
    }

    .day-checkbox.checked::after {
      content: '✓';
      color: white;
      font-size: 15px;
      font-weight: bold;
    }

    .reset-btn {
      font-size: 0.75rem;
      background: none;
      border: none;
      color: #8d99ae;
      text-decoration: underline;
      cursor: pointer;
      margin-top: 8px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Clean Styled Quote Box */
    .quote-box {
      background-color: #f8f9fa;
      border-left: 5px solid #1d3557;
      border-radius: 12px;
      padding: 30px 25px;
      margin-bottom: 20px;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.04);
      min-height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .quote-text {
      font-size: 1.15rem;
      font-weight: 600;
      line-height: 1.5;
      color: #0d1b2a;
      font-style: italic;
    }
    
    .refresh-btn {
      background-color: #1d3557;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 1.2rem;
      border-radius: 25px;
      cursor: pointer;
      font-weight: bold;
      transition: background-color 0.2s, transform 0.1s;
    }

    .refresh-btn:active {
      transform: scale(0.98);
      background-color: #457b9d;
    }

    .footer {
      margin-top: 30px;
      padding-top: 15px;
      border-top: 1px solid #e0e1dd;
      font-size: 0.95rem;
      font-weight: 500;
      color: #457b9d;
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <div class="card">
    <!-- Header Image -->
    <img src="./header.png" alt="Header Image" class="header-image">

    <!-- Meds Taken Button (Under header, above h1) -->
    <div>
      <button onclick="triggerCelebration()" id="takenBtn" class="meds-btn">→ Meds taken! ←</button>
      <div id="statusMsg" class="status-msg">Text me to let me know please ♥︎</div>
    </div>

    <h1>I'm proud of you! I love you Naomi.</h1>

    <!-- Weekly Checklist Tracker -->
    <div class="weekly-tracker-container">
      <div class="tracker-title">Weekly Tracker</div>
      <div class="weekly-tracker">
        <div class="day-box" onclick="toggleDay('Mon')"><span class="day-label">M</span><div class="day-checkbox" id="check-Mon"></div></div>
        <div class="day-box" onclick="toggleDay('Tue')"><span class="day-label">T</span><div class="day-checkbox" id="check-Tue"></div></div>
        <div class="day-box" onclick="toggleDay('Wed')"><span class="day-label">W</span><div class="day-checkbox" id="check-Wed"></div></div>
        <div class="day-box" onclick="toggleDay('Thu')"><span class="day-label">T</span><div class="day-checkbox" id="check-Thu"></div></div>
        <div class="day-box" onclick="toggleDay('Fri')"><span class="day-label">F</span><div class="day-checkbox" id="check-Fri"></div></div>
        <div class="day-box" onclick="toggleDay('Sat')"><span class="day-label">S</span><div class="day-checkbox" id="check-Sat"></div></div>
        <div class="day-box" onclick="toggleDay('Sun')"><span class="day-label">S</span><div class="day-checkbox" id="check-Sun"></div></div>
      </div>
      <button class="reset-btn" onclick="resetWeek()">Reset Week</button>
    </div>
    
    <!-- Clean Styled Quote Box -->
    <div class="quote-box">
      <div class="quote-text" id="quoteBox">Loading quote...</div>
    </div>

    <button onclick="getRandomQuote()" class="refresh-btn" title="New Quote">⟳</button>

    <div class="footer">Stay consistent, you got this! <br> - Catarina ♥︎ </div>
  </div>

  <script>
    // Configured JSONBin Credentials
    const BIN_ID = "6a69d336f5f4af5e29d0be8d";
    const API_KEY = "$2a$10$eBFQ2YzygW4AAi0WcsshQ.Vmn6huPOOVvpCIw5UL/uwKicR7S6X3W";

    let weekData = { Mon: false, Tue: false, Wed: false, Thu: false, Fri: false, Sat: false, Sun: false };

    // Fetch saved checklist from cloud on page load
    function loadTracker() {
      fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
        headers: { "X-Master-Key": API_KEY }
      })
      .then(res => res.json())
      .then(data => {
        if (data.record) {
          weekData = data.record;
          updateTrackerUI();
        }
      })
      .catch(err => console.error("Error loading tracker:", err));
    }

    // Save checklist updates to cloud
    function saveTracker() {
      fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
        method: "PUT",
        headers: {
          "Content-Type": "application/json",
          "X-Master-Key": API_KEY
        },
        body: JSON.stringify(weekData)
      })
      .then(() => updateTrackerUI())
      .catch(err => console.error("Error saving tracker:", err));
    }

    function updateTrackerUI() {
      Object.keys(weekData).forEach(day => {
        const el = document.getElementById(`check-${day}`);
        if (el) {
          if (weekData[day]) {
            el.classList.add('checked');
          } else {
            el.classList.remove('checked');
          }
        }
      });
    }

    function toggleDay(day) {
      weekData[day] = !weekData[day];
      updateTrackerUI();
      saveTracker();
    }

    function resetWeek() {
      if (confirm("Reset the checklist for a new week?")) {
        Object.keys(weekData).forEach(day => weekData[day] = false);
        updateTrackerUI();
        saveTracker();
      }
    }

    const quotes = [
      "You make the world brighter just by being in it.",
      "I'll always be here, cheering you on.",
      "Whatever tomorrow brings, you got it, always.",
      "Taking care of yourself is the best gift you can give your loved ones.",
      "I'm so proud of the effort you put in every day.",
      "You are stronger and kinder than you give yourself credit for.",
      "You are deeply and endlessly loved.",
      "No matter how tough a day gets, remember you will never be alone.",
      "Keep taking care of yourself, thriving and growing.",
      "You're doing so good, you're doing better than you think you are.",
      "Every little routine you build is a big step towards your goals.",
      "Be kind to yourself as you are to everyone else.",
      "Trust the process even on slow days.",
      "Keep showing up for yourself even in small ways.",
      "You are building a healthier, stronger version of yourself every day.",
      "Tiny habits make massive difference overtime.",
      "Give yourself credit for simply showing up today.",
      "Keep going, you're always a step closer than yesterday.",
      "Your peace of mind is always worth prioritizing.",
      "Be patient with yourself, everything takes time.",
      "Honor your pace, you don't have to race anyone else.",
      "Your feelings are valid but they don't define you or your future.",
      "Give yourself the grace you so freely give to others.",
      "In the middle of difficulty lies opportunity.",
      "You don't need to stay positive every second, just keep caring for yourself.",
      "You aren't selfish for prioritizing yourself, self care is essential.",
      "Give yourself time, flowers don't bloom overnight.",
      "You are allowed to take up space and prioritize your wellness.",
      "Always believe you can, you can do and achieve anything.",
      "You are stronger than your doubts.",
      "You are capable of doing amazing things.",
      "Your effort never goes unnoticed.",
      "Radiate positivity, and it will come back to you tenfold.",
      "Keep shining, the world needs your kind of light.",
      "Good things are coming your way, stay open to them, don't overthink the bad days.",
      "You bring the best in people around you.",
      "You are a ray of sunshine on a cloudy day.",
      // bible quotes
      "I can do all things through Christ who gives me strength. — Philippians 4:13",
      "Do you not know that your bodies are temples of the Holy Spirit? Honor God with your body. — 1 Corinthians 6:19-20",
      "She clothes herself with strength and dignity, and she laughs without fear of the future. — Proverbs 31:25",
      "Cast all your anxiety on Him because He cares for you. — 1 Peter 5:7",
      "The Lord is my strength and my shield; my heart trusts in Him, and He helps me. — Psalm 28:7",
      "Peace I leave with you; my peace I give you. Do not let your hearts be troubled. — John 14:27",
      "God is within her, she will not fall; God will help her at break of day. — Psalm 46:5",

      "The Lord will keep you from all harm—He will watch over your life. — Psalm 121:7",
      "He restores my soul; He leads in paths of righteousness for His name's sake. — Psalm 23:3",
      "Let all that you do be done in love. — 1 Corinthians 16:14",
      "Do not be anxious about anything, but in every situation present your requests to God. — Philippians 4:6",
      "And the peace of God, which transcends all understanding, will guard your hearts. — Philippians 4:7",
      "You are altogether beautiful, my darling; there is no flaw in you. — Song of Solomon 4:7",
      "Be completely humble and gentle; be patient, bearing with one another in love. — Ephesians 4:2",
      "The Lord is good, a refuge in times of trouble. He cares for those who trust in Him. — Nahum 1:7",
      "May the God of hope fill you with all joy and peace as you trust in Him. — Romans 15:13",

    let currentQuoteIndex = -1;

    function getRandomQuote() {
      if (quotes.length <= 1) return;
      
      let newIndex;
      do {
        newIndex = Math.floor(Math.random() * quotes.length);
      } while (newIndex === currentQuoteIndex);

      currentQuoteIndex = newIndex;
      document.getElementById('quoteBox').innerText = `"${quotes[currentQuoteIndex]}"`;
    }

    function triggerCelebration() {
      // Launch Confetti
      confetti({
        particleCount: 100,
        spread: 70,
        origin: { y: 0.6 }
      });

      // Update UI
      const btn = document.getElementById('takenBtn');
      const msg = document.getElementById('statusMsg');

      btn.innerText = "good girl";
      btn.style.backgroundColor = "#457b9d";
      msg.style.display = "block";
    }

    // Initialize
    getRandomQuote();
    loadTracker();
  </script>

</body>
</html>
