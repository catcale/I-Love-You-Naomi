<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily quote for my baby</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0d1b2a; /* Deep navy blue background */
      color: #1b263b; /* Dark navy text */
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
      text-align: center;
    }
    .card {
      background: #ffffff;
      padding: 35px;
      border-radius: 24px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
      max-width: 650px; /* Expanded card width to comfortably fit the giant letter */
      width: 100%;
    }
    .header-image {
      max-width: 140px;
      height: auto;
      margin-bottom: 15px;
      display: block;
      margin-left: auto;
      margin-right: auto;
    }
    h1 {
      font-size: 1.3rem;
      color: #1d3557;
      margin-top: 0;
      margin-bottom: 20px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    
    /* 3x LARGER LETTER CONTAINER */
    .quote-box-container {
      background-image: url('./letter.png');
      background-size: contain;
      background-position: center;
      background-repeat: no-repeat;
      padding: 80px 50px; /* Extra padding keeps text neatly centered inside the large graphic */
      margin-bottom: 25px;
      min-height: 540px; /* Scaled up ~3x from 180px */
      display: flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
    }
    .quote-text {
      font-size: 1.35rem; /* Slightly larger text so it fills the big letter nicely */
      font-weight: 600;
      line-height: 1.5;
      color: #0d1b2a;
      width: 100%;
    }
    
    button {
      background-color: #1d3557;
      color: white;
      border: none;
      padding: 14px 28px;
      font-size: 1.3rem;
      border-radius: 25px;
      cursor: pointer;
      font-weight: bold;
      transition: background-color 0.2s, transform 0.1s;
    }
    button:active {
      transform: scale(0.98);
      background-color: #457b9d;
    }
    .footer {
      margin-top: 30px;
      padding-top: 15px;
      border-top: 1px solid #e0e1dd;
      font-size: 0.95rem;
      font-weight: 500;
      color: #457b9d;
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <div class="card">
    <!-- Header Image -->
    <img src="./header.png" alt="Header Image" class="header-image">

    <h1>I'm proud of you for taking your meds!</h1>
    
    <!-- 3x Larger Letter PNG Box -->
    <div class="quote-box-container">
      <div class="quote-text" id="quoteBox">Loading quote...</div>
    </div>

    <button onclick="getRandomQuote()">⟳</button>
    <div class="footer">I love you Naomi. <br> Stay consistent, you got this! <br> - Catarina ♥︎ </div>
  </div>

  <script>
    const quotes = [
      "You're doing great, and I'm so proud of you every day.",
      "Hope your day is as bright and wonderful as your smile.",
      "Just a reminder: you are loved, appreciated, and cherished.",
      "One step at a time — you've got this!",
      "I love you more than coffee, and that's saying a lot."
    ];

    let currentQuoteIndex = -1;

    function getDailyQuote() {
      const now = new Date();
      const start = new Date(now.getFullYear(), 0, 0);
      const diff = now - start;
      const oneDay = 1000 * 60 * 60 * 24;
      const dayOfYear = Math.floor(diff / oneDay);
      
      currentQuoteIndex = dayOfYear % quotes.length;
      document.getElementById('quoteBox').innerText = `"${quotes[currentQuoteIndex]}"`;
    }

    function getRandomQuote() {
      if (quotes.length <= 1) return;
      
      let newIndex;
      do {
        newIndex = Math.floor(Math.random() * quotes.length);
      } while (newIndex === currentQuoteIndex);

      currentQuoteIndex = newIndex;
      document.getElementById('quoteBox').innerText = `"${quotes[currentQuoteIndex]}"`;
    }

    getDailyQuote();
  </script>

</body>
</html>
